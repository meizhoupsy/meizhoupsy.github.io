<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mei Zhou studies statistical learning, working memory, and computational neuroscience at The University of Hong Kong.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#183c8c">
  <title>Mei Zhou — Academic Profile</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23ffffff'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-size='24' font-weight='700' letter-spacing='-1' fill='%23182334'%3EMZ%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script defer src="content.js"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner container">
      <a class="brand" href="#home" aria-label="Academic profile home"><span id="brand-label">Academic profile</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu <span aria-hidden="true">+</span></button>
      <nav id="site-nav" aria-label="Main navigation"></nav>
    </div>
  </header>
  <main id="main" class="container">
    <section class="hero" id="home" aria-labelledby="profile-name">
      <div class="hero-copy">
        <img class="profile-portrait" src="assets/mei-zhou-portrait.jpeg" alt="Mei Zhou" width="785" height="788">
        <h1 id="profile-name">Mei Zhou</h1>
        <p class="affiliation" id="affiliation-line"></p>
        <div class="bio" id="profile-bio"></div>
        <div class="hero-actions"><a class="text-link" href="assets/CV_MeiZhou.pdf" id="view-cv-link"></a></div>
      </div>
      <figure class="research-network" aria-label="Research interests">
        <svg id="research-network" viewBox="0 0 460 600" role="img" aria-labelledby="network-title network-description">
          <title id="network-title">Research interests</title>
          <desc id="network-description">A conceptual map of statistical learning, working memory, computational neuroscience, EEG, eyetracking, attention, probabilistic processing, and related research interests. Connections indicate related interests, not measured relationships.</desc>
          <g id="network-edges" aria-hidden="true"></g>
          <g id="network-nodes" aria-hidden="true"></g>
        </svg>
      </figure>
      <p class="draft-note" id="draft-note"></p>
    </section>
    <section class="section research-section" id="research" aria-labelledby="research-title">
      <div class="section-heading"><h2 id="research-title"></h2></div>
      <div class="research-grid" id="research-grid"></div>
    </section>
    <div id="academic-record"></div>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><p id="footer-label"></p><a href="#home" id="back-to-top"></a></div></footer>
  <noscript><div class="noscript-note">Please enable JavaScript to view the editable academic profile.</div></noscript>
</body>
</html>
